<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OXO Scheduler Dual Countdown</title>
  <style>
    body { margin: 0; background: black; font-family: monospace; }
    video { width: 100vw; height: 100vh; object-fit: cover; display: none; }

    #countdownHappy {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4vw;
      font-weight: bold;
      color: #FFFFFF;
      display: none;
    }

    #countdownFootball {
      position: absolute;
      top: 70px;
      right: 5%;
      font-size: 4vw;
      font-weight: bold;
      color: #FFD700;
      display: none;
    }

    #debug {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: #0f0;
      font-size: 12px;
      white-space: pre-wrap;
      display: block; /* forziamo visibile per il test */
      max-width: 90vw;
      background: rgba(0,0,0,.4);
      padding: 8px 10px;
      border-radius: 6px;
    }

    #overlayFade {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease-in-out;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="overlayFade"></div>

<!-- FRONT video -->
<video id="video" autoplay muted playsinline></video>
<!-- BACK video (preload) -->
<video id="videoNext" autoplay muted playsinline style="display:none"></video>

<!-- Logo -->
<video id="logoVideo" autoplay muted loop playsinline style="display: none;">
  <source src="TV/logo.mp4" type="video/mp4">
</video>

<div id="countdownHappy"></div>
<div id="countdownFootball"></div>
<div id="debug">boot…</div>

<script>
/* ===== Logger a schermo ===== */
const debug = document.getElementById('debug');
function dlog(...args){ console.log(...args); debug.textContent += '\\n' + args.map(x=>typeof x==='object'?JSON.stringify(x):x).join(' '); }
window.addEventListener('error', e => { debug.textContent += '\\nERR: ' + (e.message||e.error); });
window.addEventListener('unhandledrejection', e => { debug.textContent += '\\nREJ: ' + (e.reason && (e.reason.message||e.reason)) ; });

/* === Riferimenti DOM === */
let front = document.getElementById('video');
let back  = document.getElementById('videoNext');
const logoVideo = document.getElementById('logoVideo');
const countdownHappy = document.getElementById('countdownHappy');
const countdownFootball = document.getElementById('countdownFootball');
const overlay = document.getElementById("overlayFade");

/* === Stato globale === */
const versione = "TV";
let dateStr = new Date().toISOString().split("T")[0];
let schedule = null;
let videoMap = {};
const base = "TV/";
let current = 0;
let playlist = [];
let countdownTimer = null;
let swapping = false;

/* === Utility orari/section === */
function getDayAndSection() {
  const now = new Date();
  let day = now.getDay();
  if (day === 0) day = 7;
  const h = now.getHours(), m = now.getMinutes();
  const min = h * 60 + m;
  if (min < 300) { day -= 1; if (day < 1) day = 7; }

  let section = "Closed";
  if (min >= 1110 && min < 1260) section = "Happy_Hour";
  else if (min >= 1260 && min < 1320) section = "Standard_1";
  else if (min >= 1320 || min < 120) section = "DJ";
  else if (min >= 120 && min < 300) section = "Standard_2";
  else if (min >= 300 && min < 1110) section = "Closed";
  return { day, min, section };
}

function updateDebug(day, section, name) {
  const dayLabel = schedule[dateStr]
    ? `Specific ${dateStr}`
    : (schedule[day] && Object.values(schedule[day]).some(arr => arr.length > 0))
      ? `Day ${day}` : `Day ${day} Default`;

  const txt =
`🕒 ${new Date().toLocaleTimeString()}
📅 Scheduled day: ${dayLabel}
🎯 Section: ${section}
🎞️ Clip: ${name}
📦 Version: ${versione}`;
  dlog(txt);
}

/* === Countdown === */
function updateCountdown(element, targetHour) {
  const now = new Date();
  const target = new Date();
  target.setHours(targetHour, 0, 0, 0);
  if (now > target) target.setDate(target.getDate() + 1);
  const diff = target - now;
  const h = Math.floor(diff / 1000 / 60 / 60);
  const m = Math.floor((diff / 1000 / 60) % 60);
  const s = Math.floor((diff / 1000) % 60);
  element.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function isHappyCountdownActive(min) { return min >= 1140 && min < 1260; }
function isFootballCountdownActive(min, currentDateStr) { return currentDateStr === "2025-07-13" && (min >= 1140 || min < 120); }
function applyCountdowns(name, min) {
  clearInterval(countdownTimer);
  countdownHappy.style.display = "none";
  countdownFootball.style.display = "none";
  if (!name) return;
  if (name.includes("Happy") && isHappyCountdownActive(min)) {
    countdownHappy.style.display = "block";
    updateCountdown(countdownHappy, 21);
    countdownTimer = setInterval(() => updateCountdown(countdownHappy, 21), 1000);
  } else if (name.includes("Football") && isFootballCountdownActive(min, dateStr)) {
    countdownFootball.style.display = "block";
    updateCountdown(countdownFootball, 2);
    countdownTimer = setInterval(() => updateCountdown(countdownFootball, 2), 1000);
  }
}

/* === Video helpers === */
function safePlay(v){ const p=v.play(); if (p && p.catch) p.catch(()=>{}); }
function preloadInto(videoEl, src) {
  return new Promise((resolve, reject) => {
    if (!src) return reject("no src");
    const ok = () => { cleanup(); resolve(); };
    const ko = (e) => { cleanup(); reject(e); };
    const cleanup = () => {
      videoEl.removeEventListener('canplay', ok);
      videoEl.removeEventListener('error', ko);
    };
    videoEl.addEventListener('canplay', ok, {once:true});
    videoEl.addEventListener('error', ko, {once:true});
    videoEl.preload = 'auto';
    videoEl.src = src;
    videoEl.load();
  });
}

/* === Gestione loop === */
function pickNextSrcAndName() {
  const { day, min, section } = getDayAndSection();
  const active = !(section === "Closed");
  if (!active) return { active:false, section, min, name:null, src:null, day };

  const today = schedule[dateStr] || schedule[day] || schedule["default"];
  playlist = today[section];
  if (!playlist || playlist.length === 0) playlist = schedule["default"][section] || [];
  if (!playlist || playlist.length === 0) return { active:true, section, min, name:null, src:null, day };

  const name = playlist[current % playlist.length];
  const src  = videoMap[name] || (base + name);
  return { active:true, section, min, name, src, day };
}

function showLogo(day, section) {
  front.pause(); front.style.display = "none";
  back.pause();  back.style.display  = "none";
  logoVideo.style.display = "block";
  logoVideo.play();
  updateDebug(day, section, "-");
  setTimeout(startOrContinueLoop, 60000);
}

async function startOrContinueLoop() {
  const now = new Date();
  const newDateStr = now.toISOString().split("T")[0];
  if (newDateStr !== dateStr) dateStr = newDateStr;
  const pick = pickNextSrcAndName();

  if (!pick.active) { dlog('Closed → logo'); showLogo(pick.day, pick.section); return; }
  if (!pick.src)  { dlog('No video in section'); front.style.display="none"; updateDebug(pick.day,pick.section,"No video"); setTimeout(startOrContinueLoop,15000); return; }

  if (front.style.display === "none") {
    try { dlog('Preload FIRST', pick.src); await preloadInto(front, pick.src); }
    catch (e) { dlog('Preload FIRST FAIL', e?.message||e); setTimeout(startOrContinueLoop, 5000); return; }
    front.style.display = "block";
    safePlay(front);
    updateDebug(pick.day, pick.section, pick.name);
    applyCountdowns(pick.name, pick.min);

    current++;
    const nextPick = pickNextSrcAndName();
    if (nextPick.active && nextPick.src) {
      dlog('Preload NEXT', nextPick.src);
      preloadInto(back, nextPick.src).catch(e=>dlog('Preload NEXT FAIL', e?.message||e));
    }
    return;
  }
}

/* === Swap con fade === */
async function doSwapWithFade() {
  if (swapping) return;
  swapping = true;
  overlay.style.opacity = "1";
  setTimeout(async () => {
    back.currentTime = 0;
    safePlay(back);
    front.pause(); front.style.display = "none";
    back.style.display = "block";
    [front, back] = [back, front];

    const { day, min, section } = getDayAndSection();
    const playingName = front.currentSrc.split('/').pop();
    updateDebug(day, section, playingName);
    applyCountdowns(playingName, min);

    overlay.style.opacity = "0";

    current++;
    const nextPick = pickNextSrcAndName();
    if (nextPick.active && nextPick.src) {
      dlog('Preload NEXT after swap', nextPick.src);
      preloadInto(back, nextPick.src).catch(e=>dlog('Preload NEXT FAIL', e?.message||e));
    } else {
      showLogo(day, section);
    }
    swapping = false;
  }, 1000);
}
function onFrontTimeUpdate() {
  if (!isFinite(front.duration) || front.duration <= 0) return;
  const rem = front.duration - front.currentTime;
  if (rem <= 1.06) doSwapWithFade();
}
function onFrontEnded(){ doSwapWithFade(); }

/* === Boot === */
function fadeBootAndStart() {
  overlay.style.opacity = "1";
  setTimeout(() => { startOrContinueLoop(); overlay.style.opacity = "0"; }, 500);
}

/* === Load schedule con cache-buster === */
async function loadScheduleOrFail() {
  const url = 'schedule.json?_=' + Date.now(); // evita cache Pages/CDN
  dlog('Fetching', url);
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('schedule.json non trovato (' + res.status + ')');
  const txt = await res.text();
  dlog('schedule bytes', txt.length);
  return JSON.parse(txt);
}

/* === Start === */
window.addEventListener('load', async () => {
  try {
    schedule = await loadScheduleOrFail();
  } catch (e) {
    debug.textContent += '\\nERRORE LOAD: ' + (e.message||e);
    return;
  }
  // costruisci mappa
  videoMap = {};
  Object.values(schedule).forEach(day => {
    Object.values(day).flat().forEach(name => { videoMap[name] = base + name; });
  });
  dlog('videoMap size', Object.keys(videoMap).length);

  front.addEventListener('timeupdate', onFrontTimeUpdate);
  front.addEventListener('ended', onFrontEnded);

  fadeBootAndStart();
});
</script>
</body>
</html>
