<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OXO Scheduler Dual Countdown</title>
  <style>
    body { margin: 0; background: black; font-family: monospace; }
    video { width: 100vw; height: 100vh; object-fit: cover; display: none; }

    #countdownHappy {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4vw;
      font-weight: bold;
      color: #FFFFFF;
      display: none;
    }

    #countdownFootball {
      position: absolute;
      top: 70px;
      right: 5%;
      font-size: 4vw;
      font-weight: bold;
      color: #FFD700;
      display: none;
    }

    #debug {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      font-size: 1em;
      white-space: pre-line;
      display: none;
    }

    #overlayFade {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease-in-out;
      z-index: 10;
    }
  </style>
</head>
<body>

<div id="overlayFade"></div>

<video id="video" autoplay muted playsinline></video>
<video id="logoVideo" autoplay muted loop playsinline style="display: none;">
  <source src="TV/logo.mp4" type="video/mp4">
</video>

<div id="countdownHappy"></div>
<div id="countdownFootball"></div>
<div id="debug"></div>

<script>
/* === IL TUO SCRIPT ORIGINALE QUI (schedule, playNext, fadeToNext, ecc.) === */
/* NON MODIFICATO */
</script>

<!-- ========== ADDON SEAMLESS (fuori dallo script originale) ========== -->
<script>
(function(){
  const front = document.getElementById("video");
  const back  = document.createElement("video");
  back.autoplay = true;
  back.muted = true;
  back.playsInline = true;
  back.style.display = "none";
  document.body.appendChild(back);

  let swapping = false;

  // Precarica il prossimo video quando quello davanti inizia
  front.addEventListener("playing", () => {
    try {
      const { day, min, section } = getDayAndSection();
      const today = schedule[dateStr] || schedule[day] || schedule["default"];
      const list = today?.[section] || schedule["default"]?.[section] || [];
      if (list.length > 0) {
        const nextName = list[current % list.length];
        const src = videoMap[nextName];
        back.src = src;
        back.load();
        back.dataset.name = nextName;
      }
    } catch(e){}
  });

  // Intercetta lo swap al posto di playNext
  front.removeEventListener("ended", fadeToNext);
  front.addEventListener("ended", () => {
    if (swapping) return;
    swapping = true;
    const overlay = document.getElementById("overlayFade");
    overlay.style.opacity = "1";

    setTimeout(() => {
      if (!back.src) {
        // fallback se non c'è buffer
        overlay.style.opacity = "0";
        swapping = false;
        return fadeToNext();
      }

      // swap vero e proprio
      back.currentTime = 0;
      back.style.display = "block";
      back.play().catch(()=>{});
      front.style.display = "none";

      // scambia i ruoli
      const tmp = front.src;
      front.src = back.src;
      back.src = tmp;

      overlay.style.opacity = "0";
      swapping = false;
    }, 800);
  });
})();
</script>

</body>
</html>
