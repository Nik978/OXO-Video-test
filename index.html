  <title>OXO Scheduler Dual Countdown</title>
  <style>
    body { margin: 0; background: black; font-family: monospace; }
    video { width: 100vw; height: 100vh; object-fit: cover; display: none; }
    #countdownHappy {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      font-size: 4vw; font-weight: bold; color: #FFFFFF; display: none;
    }
    #countdownFootball {
      position: absolute; top: 70px; right: 5%;
      font-size: 4vw; font-weight: bold; color: #FFD700; display: none;
    }
    #debug {
      position: absolute; bottom: 10px; left: 10px;
      color: white; font-size: 1em; white-space: pre-line; display: none;
    }
    #overlayFade {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: black; opacity: 0; pointer-events: none;
      transition: opacity 0.8s ease-in-out; z-index: 10;
    }
  </style>
</head>
<body>

<div id="overlayFade"></div>

<!-- VIDEO PRINCIPALE -->
<video id="video" autoplay muted playsinline></video>

const video = document.getElementById('video');
const logoVideo = document.getElementById('logoVideo');
const countdownHappy = document.getElementById('countdownHappy');
const countdownFootball = document.getElementById('countdownFootball');
const debug = document.getElementById('debug');
const overlay = document.getElementById("overlayFade");
const versione = "TV";
let dateStr = new Date().toISOString().split("T")[0];
const base = "TV/";
let videoMap = {};
Object.values(schedule).forEach(day => {
  Object.values(day).flat().forEach(name => { videoMap[name] = base + name; });
});
let current = 0, playlist = [], countdownTimer = null;

function getDayAndSection(){
  const now = new Date(); let day = now.getDay(); if (day===0) day=7;
  const h=now.getHours(), m=now.getMinutes(); const min=h*60+m;
  let section="Happy_Hour"; // semplificato per test
  return {day,min,section};
}
function updateDebug(day,section,name){
  debug.style.display="block";
  debug.innerText=`🕒 ${new Date().toLocaleTimeString()}\n🎯 ${section}\n🎞️ ${name}`;
}
function updateCountdown(el,targetHour){
  const now=new Date(); const t=new Date();
  t.setHours(targetHour,0,0,0); if(now>t)t.setDate(t.getDate()+1);
  const diff=t-now,h=Math.floor(diff/36e5),m=Math.floor(diff/6e4)%60,s=Math.floor(diff/1e3)%60;
  el.innerText=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function isHappyCountdownActive(min){ return min>=1140&&min<1260; }

function playNext(){
  const {day,min,section}=getDayAndSection();
  playlist=schedule[dateStr]?.[section]||schedule[day]?.[section]||schedule["default"][section]||[];
  if(!playlist.length){ logoVideo.style.display="block"; return; }
  const name=playlist[current%playlist.length]; const src=videoMap[name];
  video.src=src; video.style.display="block"; video.play();
  updateDebug(day,section,name);
  clearInterval(countdownTimer); countdownHappy.style.display="none";
  if(name.includes("Happy")&&isHappyCountdownActive(min)){
    countdownHappy.style.display="block";
    updateCountdown(countdownHappy,21);
    countdownTimer=setInterval(()=>updateCountdown(countdownHappy,21),1000);
  }
  current++;
}
function fadeToNext(){
  overlay.style.opacity="1";
  setTimeout(()=>{ playNext(); overlay.style.opacity="0"; },1000);
}
video.addEventListener('ended',fadeToNext);
window.addEventListener('load',()=>{ overlay.style.opacity="1"; setTimeout(()=>{ playNext(); overlay.style.opacity="0";},500); });
</script>

<!-- =============== SEAMLESS ADDON =============== -->
<script>
const videoNext=document.createElement('video');
videoNext.autoplay=true; videoNext.muted=true; videoNext.playsInline=true;
videoNext.style.display='none'; document.body.appendChild(videoNext);
let front=video, back=videoNext;
function seamlessSwap(){
  overlay.style.opacity="1";
  setTimeout(()=>{
    back.currentTime=0; back.play().catch(()=>{});
    front.pause(); front.style.display="none";
    back.style.display="block"; [front,back]=[back,front];
    overlay.style.opacity="0";
  },800);
}
[front,back].forEach(v=>v.addEventListener('ended',seamlessSwap));
</script>

<!-- =============== NETWORK RESILIENCE ADDON =============== -->
<script>
function onStallLike(){
  this.play().catch(()=>{});
  clearTimeout(this._stallT);
  this._stallT=setTimeout(()=>{ seamlessSwap(); },1500);
}
function onPlaying(){ clearTimeout(this._stallT); }
[front,back].forEach(v=>{
  v.addEventListener('waiting',onStallLike);
  v.addEventListener('stalled',onStallLike);
  v.addEventListener('suspend',onStallLike);
  v.addEventListener('playing',onPlaying);
});
</script>

<!-- =============== SERVICE WORKER REG =============== -->
<script>
if('serviceWorker'in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
