  <style>
    body { margin: 0; background: black; font-family: monospace; }
    video { width: 100vw; height: 100vh; object-fit: cover; display: none; }

    #countdownHappy {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4vw;
      font-weight: bold;
      color: #FFFFFF;
      display: none;
    }

    #countdownFootball {
      position: absolute;
      top: 70px;
      right: 5%;
      font-size: 4vw;
      font-weight: bold;
      color: #FFD700;
      display: none;
    }

    #debug {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      font-size: 1em;
      white-space: pre-line;
    }

    #overlayFade {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: black;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease-in-out; /* tua transizione */
      z-index: 10;
    }
  </style>
</head>

/* === RIFERIMENTI DOM (identici) === */

const countdownFootball = document.getElementById('countdownFootball');
const debug = document.getElementById('debug');
const versione = "TV";
let dateStr = new Date().toISOString().split("T")[0];

/* === TUO JSON -> mappa sorgenti === */
const base = "TV/";
const videoMap = {};
Object.values(schedule).forEach(day => {
  Object.values(day).flat().forEach(name => {
    if (!name) return;
    videoMap[name] = (/^https?:\/\//i.test(name) || name.includes('/')) ? name : (base + name);
  });
});

/* === Logica giorni/fasce (identica) === */
function getDayAndSection() {
  const now = new Date();
  let day = now.getDay();
  if (day === 0) day = 7;

  const h = now.getHours(), m = now.getMinutes();
  const min = h * 60 + m;

  if (min < 300) {
    day -= 1;
    if (day < 1) day = 7;
  }

  let section = "Closed";
  if (min >= 1110 && min < 1260) section = "Happy_Hour";
  else if (min >= 1260 && min < 1320) section = "Standard_1";
  else if (min >= 1320 || min < 120) section = "DJ";
  else if (min >= 120 && min < 300) section = "Standard_2";
  else if (min >= 300 && min < 1110) section = "Closed";

  return { day, min, section };
}

let current = 0;
let playlist = [];
let countdownTimer = null;

function updateDebug(day, section, name) {
  let dayLabel;

  if (schedule[dateStr]) {
    dayLabel = `Specific ${dateStr}`;
  } else if (schedule[day] && Object.values(schedule[day]).some(arr => arr.length > 0)) {
    dayLabel = `Day ${day}`;
  } else {
    dayLabel = `Day ${day} Default`;
  }

  debug.innerText =
    `🕒 Time: ${new Date().toLocaleTimeString()}\n` +
    `📅 Sheduled day: ${dayLabel}\n` +
    `🎯 Sheduled Section: ${section}\n` +
    `🎞️ Video clip: ${name}\n` +
    `📦 Version: ${versione}`;
}

function updateCountdown(element, targetHour) {
  const now = new Date();
  const target = new Date();
  target.setHours(targetHour, 0, 0, 0);
  if (now > target) target.setDate(target.getDate() + 1);

  const diff = target - now;
  const h = Math.floor(diff / 1000 / 60 / 60);
  const m = Math.floor((diff / 1000 / 60) % 60);
  const s = Math.floor((diff / 1000) % 60);

  element.innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function isHappyCountdownActive(min) {
  return min >= 1140 && min < 1260; // 19:00–21:00
}
function isFootballCountdownActive(min, currentDateStr) {
  return currentDateStr === "2025-07-13" && (min >= 1140 || min < 120); // 19:00–02:00 solo il 13 luglio 2025
}

/* ===================== SEAMLESS ADDON: setup ===================== */
/* Aggiunta: secondo video "buffer" per precaricare il prossimo clip */
const videoBuffer = document.createElement('video');
videoBuffer.setAttribute('autoplay','');
videoBuffer.setAttribute('muted','');
videoBuffer.setAttribute('playsinline','');
videoBuffer.style.display = 'none';
document.body.appendChild(videoBuffer);

/* Puntatori front/back (front = tuo #video) */
let front = video;        // quello visibile (tua variabile originale)
let back  = videoBuffer;  // buffer nascosto

/* Preload helper: risolve quando il video è pronto a partire */
function preloadInto(videoEl, src) {
  return new Promise((resolve, reject) => {
    if (!src) return reject(new Error('no src'));
    const onReady = () => { cleanup(); resolve(); };
    const onErr   = (e) => { cleanup(); reject(e); };
    const cleanup = () => {
      videoEl.removeEventListener('canplay', onReady);
      videoEl.removeEventListener('error', onErr);
    };
    videoEl.addEventListener('canplay', onReady, { once:true });
    videoEl.addEventListener('error', onErr,   { once:true });
    videoEl.preload = 'auto';
    videoEl.src = src;
    videoEl.load();
  });
}
function safePlay(v){ const p=v.play(); if (p && p.catch) p.catch(()=>{}); }
/* ================================================================ */

/* === TUA logica di selezione === */
function pickTodaySectionAndList() {
  const { day, min, section } = getDayAndSection();
  const active = !(section === "Closed");
  const today = schedule[dateStr] || schedule[day] || schedule["default"];
  let list = today && today[section];
  if (!list || list.length === 0) list = (schedule["default"] && schedule["default"][section]) || [];
  return { day, min, section, active, list };
}

/* === TUA funzione playNext (identico nome) con SEAMLESS inside === */
async function playNext() {
  const { day, min, section, active, list } = pickTodaySectionAndList();

  if (!active) {
    front.pause();
    front.style.display = "none";
    logoVideo.style.display = "block";
    logoVideo.play();
    updateDebug(day, section, "-");
    countdownHappy.style.display = "none";
    countdownFootball.style.display = "none";
    setTimeout(() => playNext(), 60000);
    return;
  }

  logoVideo.pause();
  logoVideo.style.display = "none";

  playlist = Array.isArray(list) ? list : [];
  if (playlist.length === 0) {
    front.style.display = "none";
    updateDebug(day, section, "No video");
    return;
  }

  /* === SEAMLESS ADDON: Prima partenza o rientro === */
  if (front.style.display === "none") {
    const name = playlist[current % playlist.length];
    const src  = videoMap[name];
    try { await preloadInto(front, src); } catch(e) { /* riprova presto */ setTimeout(playNext, 5000); return; }
    front.style.display = "block";
    safePlay(front);
    updateDebug(day, section, name);

    clearInterval(countdownTimer);
    countdownHappy.style.display = "none";
    countdownFootball.style.display = "none";
    if (name.includes("Happy") && isHappyCountdownActive(min)) {
      countdownHappy.style.display = "block";
      updateCountdown(countdownHappy, 21);
      countdownTimer = setInterval(() => updateCountdown(countdownHappy, 21), 1000);
    } else if (name.includes("Football") && isFootballCountdownActive(min, dateStr)) {
      countdownFootball.style.display = "block";
      updateCountdown(countdownFootball, 2);
      countdownTimer = setInterval(() => updateCountdown(countdownFootball, 2), 1000);
    }

    current++;
    const nextName = playlist[current % playlist.length];
    const nextSrc  = videoMap[nextName];
    preloadInto(back, nextSrc).catch(()=>{});
    return;
  }

  /* === (Caso normale) se è già in play, non fare nulla: lo swap avviene su ended/timeupdate === */
}

/* === overlay (tua) === */
const overlay = document.getElementById("overlayFade");

/* === TUA funzione fadeToNext (stesso nome) con SEAMLESS swap === */
function fadeToNext() {
  overlay.style.opacity = "1";
  setTimeout(() => {
    /* === SEAMLESS ADDON: swap con buffer già pronto === */
    back.currentTime = 0;
    safePlay(back);

    front.pause();
    front.style.display = "none";
    back.style.display = "block";

    // scambia i riferimenti mantenendo "video" come alias di front
    const tmp = front; front = back; back = tmp;

    // aggiorna debug e countdown sul nuovo clip in riproduzione
    const { day, min, section } = getDayAndSection();
    const playingName = front.currentSrc.split('/').pop();
    updateDebug(day, section, playingName);

    clearInterval(countdownTimer);
    countdownHappy.style.display = "none";
    countdownFootball.style.display = "none";
    if (playingName.includes("Happy") && isHappyCountdownActive(min)) {
      countdownHappy.style.display = "block";
      updateCountdown(countdownHappy, 21);
      countdownTimer = setInterval(() => updateCountdown(countdownHappy, 21), 1000);
    } else if (playingName.includes("Football") && isFootballCountdownActive(min, dateStr)) {
      countdownFootball.style.display = "block";
      updateCountdown(countdownFootball, 2);
      countdownTimer = setInterval(() => updateCountdown(countdownFootball, 2), 1000);
    }

    overlay.style.opacity = "0";

    // Precarica subito il prossimo sul "nuovo back"
    const { list } = pickTodaySectionAndList();
    if (Array.isArray(list) && list.length) {
      current++;
      const nextName = list[current % list.length];
      const nextSrc  = videoMap[nextName];
      preloadInto(back, nextSrc).catch(()=>{});
    }
  }, 1000); // come il tuo fade (0.8s + margine)
}

/* === Eventi come nel tuo === */
video.addEventListener('ended', fadeToNext);

/* === Avvio come nel tuo === */
window.addEventListener('load', () => {
  overlay.style.opacity = "1";
  setTimeout(() => {
    playNext();
    overlay.style.opacity = "0";
  }, 500);
});
</script>
