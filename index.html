<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OXO Scheduler Dual Countdown</title>
  <style>
    body { margin: 0; background: black; font-family: monospace; }
    video { width: 100vw; height: 100vh; object-fit: cover; display: none; }

    #countdownHappy {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 4vw;
      font-weight: bold;
      color: #FFFFFF;
      display: none;
    }

   #countdownFootball {
      position: absolute;
      top: 70px;
      right: 5%;
      font-size: 4vw;
      font-weight: bold;
      color: #FFD700;
      display: none;
    }

    #debug {
      position: absolute;
      bottom: 10px;
      left: 10px;
      color: white;
      font-size: 1em;
      white-space: pre-line;
      display: none;
    }

#overlayFade {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: black;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease-in-out;
  z-index: 10;
}

  </style>

</head>
<body>

<div id="overlayFade"></div>

<video id="video" autoplay muted playsinline></video>
<video id="logoVideo" autoplay muted loop playsinline style="display: none;">
  <source src="TV/logo.mp4" type="video/mp4">
</video>

<div id="countdownHappy"></div>
<div id="countdownFootball"></div>
<div id="debug"></div>

<script>
const video = document.getElementById('video');
const logoVideo = document.getElementById('logoVideo');
const countdownHappy = document.getElementById('countdownHappy');
const countdownFootball = document.getElementById('countdownFootball');
const debug = document.getElementById('debug');
const versione = "TV";
const dateStr = new Date().toISOString().split("T")[0];

const schedule = {
  "1": {
    "Happy_Hour": [],
    "Standard_1": [],
    "DJ": [],
    "Standard_2": []
  },
  "2": {
    "Happy_Hour": [],
    "Standard_1": [],
    "DJ": [],
    "Standard_2": []
  },
  "3": {
    "Happy_Hour": [],
    "Standard_1": [],
    "DJ": [],
    "Standard_2": []
  },
  "4": {
    "Happy_Hour": [],
    "Standard_1": [],
    "DJ": [],
    "Standard_2": []
  },
  "5": {
    "Happy_Hour": [],
    "Standard_1": [],
    "DJ": [],
    "Standard_2": []
  },
  "6": {
    "Happy_Hour": [],
    "Standard_1": [],
    "DJ": [],
    "Standard_2": []
  },
  "7": {
    "Happy_Hour": [],
    "Standard_1": [],
    "DJ": [],
    "Standard_2": []
  },
  "default": {
    "Happy_Hour": [
      "Intro.mp4",
      "Oxo.mp4",
      "Happy.mp4",
      "Bucket.mp4",
      "Happy.mp4",
      "Oxo2.mp4",
      "Happy.mp4",
      "Bucket.mp4",
      "Happy.mp4",
      "Oxo3.mp4"
    ],
    "Standard_1": [
      "Intro.mp4",
      "Oxo.mp4",
      "Happy.mp4",
      "Bucket.mp4",
      "Happy.mp4",
      "Oxo2.mp4",
      "Happy.mp4",
      "Bucket.mp4",
      "Happy.mp4",
      "Oxo3.mp4"
    ],
    "DJ": [
      "Intro.mp4",
      "Oxo.mp4",
      "Happy.mp4",
      "Bucket.mp4",
      "Happy.mp4",
      "Oxo2.mp4",
      "Happy.mp4",
      "Bucket.mp4",
      "Happy.mp4",
      "Oxo3.mp4"
    ],
    "Standard_2": [
      "Intro.mp4",
      "Oxo.mp4",
      "Happy.mp4",
      "Bucket.mp4",
      "Happy.mp4",
      "Oxo2.mp4",
      "Happy.mp4",
      "Bucket.mp4",
      "Happy.mp4",
      "Oxo3.mp4"
    ]
  }
}; // fine schedule


// ---- Fine JSON parsing ----

const base = "TV/";
const videoMap = {};
Object.values(schedule).forEach(day => {
  Object.values(day).flat().forEach(name => {
    videoMap[name] = base + name;
  });
});

function getDayAndSection() {
  const now = new Date();
  let day = now.getDay();
  if (day === 0) day = 7;

  const h = now.getHours(), m = now.getMinutes();
  const min = h * 60 + m;

  if (min < 300) {
    day -= 1;
    if (day < 1) day = 7;
  }

  let section = "Closed";
  if (min >= 990 && min < 1260) section = "Happy_Hour";
  else if (min >= 1260 && min < 1320) section = "Standard_1";
  else if (min >= 1320 || min < 120) section = "DJ";
  else if (min >= 120 && min < 300) section = "Standard_2";
  else if (min >= 300 && min < 990) section = "Closed";

  return { day, min, section };
}

let current = 0;
let playlist = [];
let countdownTimer = null;

function updateDebug(day, section, name) {
  let dayLabel;

  if (schedule[dateStr]) {
    dayLabel = `Specific ${dateStr}`;
  } else if (schedule[day] && Object.values(schedule[day]).some(arr => arr.length > 0)) {
    dayLabel = `Day ${day}`;
  } else {
    dayLabel = `Day ${day} Default`;
  }

  debug.innerText =
    `🕒 Time: ${new Date().toLocaleTimeString()}\n` +
    `📅 Sheduled day: ${dayLabel}\n` +
    `🎯 Sheduled Section: ${section}\n` +
    `🎞️ Video clip: ${name}\n` +
    `📦 Version: ${versione}`;
}

function updateCountdown(element, targetHour) {
  const now = new Date();
  const target = new Date();
  target.setHours(targetHour, 0, 0, 0);
  if (now > target) target.setDate(target.getDate() + 1);

  const diff = target - now;
  const h = Math.floor(diff / 1000 / 60 / 60);
  const m = Math.floor((diff / 1000 / 60) % 60);
  const s = Math.floor((diff / 1000) % 60);

  element.innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function isHappyCountdownActive(min) {
  return min >= 1140 && min < 1260; // 19:00–21:00
}
function isFootballCountdownActive(min, currentDateStr) {
  return currentDateStr === "2025-07-13" && (min >= 1140 || min < 120); // 19:00–02:00 solo il 13 luglio 2025
}

function playNext() {
  const { day, min, section } = getDayAndSection();
  const active = !(section === "Closed");

  if (!active) {
    video.pause();
    video.style.display = "none";
    logoVideo.style.display = "block";
    logoVideo.play();
    updateDebug(day, section, "-");
    countdownHappy.style.display = "none";
    countdownFootball.style.display = "none";
    setTimeout(() => playNext(), 60000);
    return;
  }

  logoVideo.pause();
  logoVideo.style.display = "none";

  const today = schedule[dateStr] || schedule[day] || schedule["default"];
  playlist = today[section];
  if (!playlist || playlist.length === 0) {
    playlist = schedule["default"][section] || [];
  }
  if (playlist.length === 0) {
    video.style.display = "none";
    updateDebug(day, section, "No video");
    return;
  }

  const name = playlist[current % playlist.length];
  const src = videoMap[name];
  video.src = src;
  video.style.display = "block";
  video.play();
  updateDebug(day, section, name);

  clearInterval(countdownTimer);
  countdownHappy.style.display = "none";
  countdownFootball.style.display = "none";

  if (name.includes("Happy") && isHappyCountdownActive(min)) {
    countdownHappy.style.display = "block";
    updateCountdown(countdownHappy, 21);
    countdownTimer = setInterval(() => updateCountdown(countdownHappy, 21), 1000);
  } else if (name.includes("Football") && isFootballCountdownActive(min, dateStr)) {
    countdownFootball.style.display = "block";
    updateCountdown(countdownFootball, 2);
    countdownTimer = setInterval(() => updateCountdown(countdownFootball, 2), 1000);
  }

  current++;
}

const overlay = document.getElementById("overlayFade");

function fadeToNext() {
  overlay.style.opacity = "1";
  setTimeout(() => {
    playNext();
    overlay.style.opacity = "0";
  }, 1000); // tempo per la dissolvenza nera
}

video.addEventListener('ended', fadeToNext);

window.addEventListener('load', () => {
  overlay.style.opacity = "1";
  setTimeout(() => {
    playNext();
    overlay.style.opacity = "0";
  }, 500);
});

</script>

</body>
</html>
